[package]
name = "glc-yt-cast"
version = "1.1.0"
description = "Lanzador rápido y minimalista de YouTube para Android TV"
authors = ["Vladivostok214"]
edition = "2021"

[lib]
name = "glc_yt_cast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
