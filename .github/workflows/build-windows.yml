name: Build Windows (Tauri v2)

on:
  push:
    branches:
      - feature/windows-tauri
      - main
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: Install Tauri CLI v2
        uses: taiki-e/install-action@cargo-tauri

      - name: Download official Google ADB for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "windows/src-tauri/bin" | Out-Null
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "platform-tools-tmp" -Force
          Copy-Item "platform-tools-tmp/platform-tools/adb.exe" "windows/src-tauri/bin/"
          Copy-Item "platform-tools-tmp/platform-tools/AdbWinApi.dll" "windows/src-tauri/bin/"
          Copy-Item "platform-tools-tmp/platform-tools/AdbWinUsbApi.dll" "windows/src-tauri/bin/"
          Remove-Item -Recurse -Force "platform-tools.zip", "platform-tools-tmp"

      - name: Build Tauri application (Windows x64)
        working-directory: windows/src-tauri
        run: cargo tauri build

      - name: Package Portable ZIP (EXE + ADB)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-portable" | Out-Null
          Copy-Item "windows/src-tauri/target/release/glc-yt-cast.exe" "dist-portable/GLC-YouTube-TV-Cast.exe"
          Copy-Item "windows/src-tauri/bin/adb.exe" "dist-portable/"
          Copy-Item "windows/src-tauri/bin/AdbWinApi.dll" "dist-portable/"
          Copy-Item "windows/src-tauri/bin/AdbWinUsbApi.dll" "dist-portable/"
          Compress-Archive -Path "dist-portable/*" -DestinationPath "glc-yt-cast-windows-portable.zip" -Force

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: glc-yt-cast-windows-portable
          path: glc-yt-cast-windows-portable.zip

      - name: Upload Windows NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: glc-yt-cast-windows-installer
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
